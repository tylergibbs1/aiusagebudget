<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Usage Budget Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e1e4ed;
    --muted: #8b8fa3; --accent: #6c5ce7; --green: #00b894; --red: #e17055;
    --blue: #0984e3; --yellow: #fdcb6e; --pink: #fd79a8; --cyan: #00cec9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px;
  }
  h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .kpi-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .kpi-value { font-size: 1.6rem; font-weight: 700; }
  .kpi-value.green { color: #00b894; }
  .kpi-sub { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 16px; }
  .card-full { grid-column: 1 / -1; }
  .chart-container { position: relative; height: 300px; }
  .chart-container-tall { position: relative; height: 350px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
  td:nth-child(2), td:nth-child(3), th:nth-child(2), th:nth-child(3) { text-align: right; }
  .bar-cell { display: flex; align-items: center; gap: 8px; }
  .bar-bg { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .tab-row { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab { padding: 6px 16px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); transition: all 0.15s; }
  .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } body { padding: 16px; } }
</style>
</head>
<body>
<h1>AI Usage Budget Dashboard</h1>
<p class="subtitle">Token usage and cost tracking across machines &mdash; $200/mo Claude subscription vs API pricing</p>
<div class="kpi-row" id="kpis"></div>
<div class="grid">
  <div class="card card-full">
    <div class="card-title">Cost Over Time</div>
    <div class="tab-row">
      <button class="tab active" data-view="daily" onclick="switchCostView('daily')">Daily</button>
      <button class="tab" data-view="weekly" onclick="switchCostView('weekly')">Weekly</button>
      <button class="tab" data-view="monthly" onclick="switchCostView('monthly')">Monthly</button>
    </div>
    <div class="chart-container-tall"><canvas id="costChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">Cost by Machine</div>
    <div class="chart-container"><canvas id="machineChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">Monthly: API Cost vs $200/mo Subscription</div>
    <div class="chart-container"><canvas id="savingsChart"></canvas></div>
  </div>
  <div class="card card-full">
    <div class="card-title">Machine Breakdown</div>
    <table id="machineTable">
      <thead><tr><th>Machine</th><th>Tokens</th><th>API Cost</th><th style="width:40%">Share</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

  var sheetMap = { daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly' };
  var sheetCostKey = view === 'monthly' ? costKey : 'Cost ($)';
  var rows = DATA[sheetMap[view]].filter(function(r) { return r.Date !== 'TOTALS'; });
  var dateMap = {};
  rows.forEach(function(r) {
    if (!dateMap[r.Date]) dateMap[r.Date] = 0;
    dateMap[r.Date] += r[sheetCostKey] || 0;
  });
  var dates = Object.keys(dateMap).sort();
  var machines = [];
  var seen = {};
  rows.forEach(function(r) { if (!seen[r.Machine]) { seen[r.Machine] = true; machines.push(r.Machine); } });
  var datasets = machines.map(function(m) {
    return {
      label: ml(m),
      data: dates.map(function(d) {
        var row = rows.find(function(r) { return r.Date === d && r.Machine === m; });
        return row ? (row[sheetCostKey] || 0) : 0;
      }),
      backgroundColor: mc(m) + 'cc',
      borderColor: mc(m),
      borderWidth: 1,
      borderRadius: 2
    };
  });
  costChart = new Chart(canvas, {
    type: 'bar',
    data: { labels: dates, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { color: '#8b8fa3', boxWidth: 12, padding: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: function(ctx) { return ctx.dataset.label + ': ' + fmt$(ctx.raw); },
            footer: function(items) { return 'Total: ' + fmt$(items.reduce(function(s,i) { return s + i.raw; }, 0)); }
          }
        }
      },
      scales: {
        x: { stacked: true, ticks: { color: '#8b8fa3', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#2a2d3a' } },
        y: { stacked: true, ticks: { color: '#8b8fa3', callback: function(v) { return '$' + v; } }, grid: { color: '#2a2d3a' } }
      }
    }
  });
}
function switchCostView(view) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.view === view); });
  buildCostChart(view);
}
buildCostChart('daily');

// Machine Doughnut
var sortedMachines = machineTotals.slice().sort(function(a,b) { return b['Cost ($)'] - a['Cost ($)']; });
new Chart(document.getElementById('machineChart'), {
  type: 'doughnut',
  data: {
    labels: sortedMachines.map(function(r) { return ml(r.Machine); }),
    datasets: [{ data: sortedMachines.map(function(r) { return r['Cost ($)']; }), backgroundColor: sortedMachines.map(function(r) { return mc(r.Machine); }), borderWidth: 0, hoverOffset: 8 }]
  },
  options: {
    responsive: true, maintainAspectRatio: false, cutout: '60%',
    plugins: {
      legend: { position: 'right', labels: { color: '#8b8fa3', padding: 8, font: { size: 11 }, boxWidth: 12 } },
      tooltip: { callbacks: { label: function(ctx) { return ctx.label + ': ' + fmt$(ctx.raw); } } }
    }
  }
});

// Monthly Savings Chart: API cost bars vs $200 subscription line
new Chart(document.getElementById('savingsChart'), {
  type: 'bar',
  data: {
    labels: months,
    datasets: [
      {
        label: 'API Cost (equivalent)',
        data: months.map(function(m) { return monthlyAgg[m].api; }),
        backgroundColor: '#6c5ce7cc',
        borderColor: '#6c5ce7',
        borderWidth: 1,
        borderRadius: 4
      },
      {
        label: '$200/mo Subscription',
        data: months.map(function() { return SUB_COST; }),
        borderColor: '#00b894',
        borderWidth: 3,
        borderDash: [6, 4],
        type: 'line',
        fill: false,
        pointRadius: 0,
        tension: 0,
        order: 0
      }
    ]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { position: 'top', labels: { color: '#8b8fa3', boxWidth: 12, padding: 12, font: { size: 11 } } },
      tooltip: {
        callbacks: {
          afterBody: function(items) {
            var apiItem = items.find(function(i) { return i.dataset.label === 'API Cost (equivalent)'; });
            if (apiItem) {
              var saved = apiItem.raw - SUB_COST;
              return saved > 0
                ? '\n\u2705 Saving ' + fmt$(saved) + ' this month'
                : '\n\u26a0\ufe0f Sub costs ' + fmt$(Math.abs(saved)) + ' more than API';
            }
          }
        }
      }
    },
    scales: {
      x: { ticks: { color: '#8b8fa3' }, grid: { color: '#2a2d3a' } },
      y: { ticks: { color: '#8b8fa3', callback: function(v) { return '$' + v; } }, grid: { color: '#2a2d3a' } }
    }
  }
});

// Machine Table
var maxCost = sortedMachines[0]['Cost ($)'];
document.querySelector('#machineTable tbody').innerHTML = sortedMachines.map(function(r) {
  var pct = (r['Cost ($)'] / totalCost * 100).toFixed(1);
  var barPct = (r['Cost ($)'] / maxCost * 100).toFixed(0);
  return '<tr><td title="' + r.Machine + '">' + ml(r.Machine) + '</td><td>' + fmtT(r.Tokens) + '</td><td>' + fmt$(r['Cost ($)']) + '</td><td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:' + barPct + '%;background:' + mc(r.Machine) + '"></div></div><span style="color:var(--muted);font-size:0.75rem;min-width:36px">' + pct + '%</span></div></td></tr>';
}).join('');
</script>
</body>
</html>
